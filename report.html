<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audience feedback — BUS1000 tutorials</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
/* A print document that happens to be viewable on screen. The charts and the
 * quote boxes are the site's own (assets/styles.css); everything here is the
 * page furniture around them, plus the rules that make a browser's "Save as
 * PDF" produce something worth handing over. */
@page { size: A4; margin: 14mm; }

body { background: var(--panel); }
.sheet1 { max-width: 780px; margin: 0 auto; padding: 22px 18px 60px; }
h1 { font-size: 24px; margin: 0 0 4px }
.sech { font-size: 15px; margin: 26px 0 8px; display: flex; align-items: center; gap: 8px }
.sech .badge { background: var(--accent-soft); color: var(--accent) }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 18px }
.tile { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--bg) }
.tile b { display: block; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums }
.tile span { font-size: 11.5px; color: var(--muted) }

/* the quote boxes, open rather than behind a <summary> - nothing to click in
 * a PDF, so the same boxes are drawn with a heading instead */
.fbcat { margin: 10px 0 0; padding: 9px 12px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--bg) }
.fbcat h3 { display: flex; align-items: center; gap: 7px; margin: 0 0 8px;
  text-transform: uppercase; letter-spacing: .04em; font-size: 11.5px }
.fbcat h3 span { font-weight: 700; background: var(--panel); border: 1px solid var(--line-strong);
  border-radius: 999px; padding: 0 7px; letter-spacing: 0; text-transform: none }
.fbcat-positive { border-color: var(--ok); background: var(--ok-soft) }
.fbcat-positive h3 { color: var(--ok) }
.fbcat-constructive { border-color: var(--accent); background: var(--accent-soft) }
.fbcat-constructive h3 { color: var(--accent) }
.fbcat-critical { border-color: var(--warn); background: var(--warn-soft) }
.fbcat-critical h3 { color: var(--warn) }
/* one short quote per full-width row is three pages of white space */
.fbcat .fbcomments { grid-template-columns: 1fr 1fr; align-items: start }
@media (max-width: 620px) { .fbcat .fbcomments { grid-template-columns: 1fr } }

.shot-fig { margin: 14px 0 0; }
/* whole photo, never a crop - the feed made the same call, and a cropped
   portrait selfie is a picture of somebody's forehead */
.shot-fig img { display: block; margin: 0 auto; max-width: 100%; max-height: 130mm;
  width: auto; height: auto; border-radius: 9px; border: 1px solid var(--line) }
.shot-fig figcaption { font-size: 12.5px; line-height: 1.45; margin-top: 6px; color: var(--ink) }
.shot-fig .by { display: block; font-size: 11px; color: var(--muted); margin-top: 2px }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
.gallery .shot-fig img { max-height: 76mm }

.toolbar { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 18px; display: flex; gap: 10px; align-items: center; z-index: 2 }

@media print {
  /* without this the bars, the tinted boxes and the tiles all print white */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact }
  .toolbar { display: none }
  .sheet1 { max-width: none; padding: 0 }
  body { font-size: 13px }
  /* page one is the summary, on its own */
  .sheet { break-after: page }
  /* a photo or a single quote split across two pages is the thing to avoid;
   * a 40-quote box is not - it has to break somewhere */
  .shot-fig, .fbcomments li, .dvg-row, .tiles { break-inside: avoid }
  .sech { break-after: avoid }
  .fbclusters { grid-template-columns: 1fr }
  a { text-decoration: none; color: inherit }
}
</style>
</head>
<body>
<div class="toolbar">
  <strong>Audience feedback report</strong>
  <span class="sub" style="margin:0">A snapshot. Print it to PDF — A4, background graphics on.</span>
  <span class="spacer"></span>
  <a href="index.html"><button class="ghost">Back to the site</button></a>
  <button class="primary" onclick="window.print()">Save as PDF</button>
</div>
<div class="sheet1" id="report">Building the report…</div>
<script type="module" src="assets/feedback-report.js"></script>
</body>
</html>
